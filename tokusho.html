<!DOCTYPE html>
<html lang="ja">
<head>
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-PZ6SPHC4');</script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>特定商取引法に基づく表記｜おとうふのじっけんしつ</title>
    <link rel="icon" href="./favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'M PLUS Rounded 1c', sans-serif; background-color: #FDF9F2; color: #333; }
        .brand-text-navy { color: #0A2A4E; }
        .brand-text-orange { color: #F5654B; }
        .bg-brand-navy { background-color: #0A2A4E; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PZ6SPHC4" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <header class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="./" class="flex items-center space-x-3 hover:opacity-80 transition">
                <img src="https://lh3.googleusercontent.com/d/1W7QX6mIgUO8B0tnsxvTpk0njUeyAto09" alt="ロゴ" class="w-10 h-10 rounded-full border border-gray-200">
                <span class="text-lg font-bold brand-text-navy">おとうふのじっけんしつ</span>
            </a>
            <a href="./" class="text-sm font-bold brand-text-orange hover:underline">トップページに戻る ➔</a>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-6 py-12 max-w-3xl">
        <div class="bg-white rounded-2xl p-8 md:p-12 shadow-lg border border-gray-100">
            <h1 class="text-2xl md:text-3xl font-extrabold brand-text-navy mb-8 pb-4 border-b-2 border-[#F5654B] text-center">
                特定商取引法に基づく表記
            </h1>
            
            <div class="overflow-hidden border border-gray-200 rounded-xl shadow-sm">
                <table class="w-full border-collapse bg-white text-left text-sm text-gray-700">
                    <tbody id="tokusho-table-body" class="divide-y divide-gray-200">
                        <tr>
                            <td colspan="2" class="px-6 py-8 text-center text-gray-400">データを読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="py-8 bg-brand-navy mt-12 text-center text-gray-400 text-sm">
        <p>© 2025-2026 おとうふのじっけんしつ. All Rights Reserved.</p>
    </footer>

    <script>
        // メインサイトと同じGASのAPI URLを設定
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycby_zT3VlrwuzNe3Ii661mu08XvM1r9XzOAJBlO4HhQ2-BpkMQJl6J_cd5-tEtI7c5Zhng/exec';

        document.addEventListener('DOMContentLoaded', () => {
            if (GAS_API_URL) {
                fetch(`${GAS_API_URL}?action=tokusho`)
                .then(res => res.json())
                .then(data => {
                    const tableBody = document.getElementById('tokusho-table-body');
                    if (tableBody) {
                        tableBody.innerHTML = '';
                        if (data.length === 0) {
                            tableBody.innerHTML = '<tr><td colspan="2" class="px-6 py-8 text-center text-gray-500">データが登録されていません。</td></tr>';
                            return;
                        }
                        data.forEach(item => {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <th class="w-1/3 bg-gray-50 px-6 py-4 font-bold brand-text-navy border-r border-gray-200">${item.title}</th>
                                <td class="px-6 py-4 whitespace-pre-line leading-relaxed">${item.content}</td>
                            `;
                            tableBody.appendChild(tr);
                        });
                    }
                })
                .catch(err => {
                    console.error('特商法データの取得に失敗しました:', err);
                    document.getElementById('tokusho-table-body').innerHTML = '<tr><td colspan="2" class="px-6 py-8 text-center text-red-500">データの読み込みにエラーが発生しました。</td></tr>';
                });
            }
        });
    </script>
</body>
</html>
